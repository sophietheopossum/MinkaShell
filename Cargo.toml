[package]
name = "minkashell"
version = "0.1.0"
edition = "2024"
description = "Minka session shell: bar, dock, menus, notifications"

[[bin]]
name = "minkashell"
path = "src/main.rs"

[dependencies]
# "svg" is not optional here: the window-control buttons (assets/mac-glass-*.svg)
# and nearly every icon of an SVG icon theme are decoded through it, and without
# it they draw as nothing, with no message.
#
# The toolkit is MinkaDE's AntiWebUI submodule, a sibling of this one, so every Minka app
# builds the same revision and a toolkit fix reaches them all.
anti-webui = { path = "../AntiWebUI/src/anti-webui", default-features = false, features = ["svg", "wayland", "wayland-shell", "shell-apps", "shell-audio", "shell-battery", "shell-notifications", "shell-process", "shell-session", "shell-system", "shell-tray"] }
# Material 3 Expressive components, drawn in the Proustite scheme (src/theme.rs).
anti-webui-md3e = { path = "../AntiWebUI/src/anti-webui-md3e" }
calloop = { version = "0.14", default-features = false }
minka-ipc = { package = "MinkaIPC", path = "../MinkaIPC" }
serde_json = "1"
# The same zbus, with the same features, that the toolkit already builds: the
# tray rescue (src/tray_rescue.rs) makes a few calls of its own.
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.release]
lto = "thin"

# AntiWebUI's workspace patches wgpu to bea4dev's adapter-filter fork. Cargo
# reads patch tables only from the crate being built, so this one has to carry
# the same patches (pinned to the fork revision in ../AntiWebUI/Cargo.lock).
[patch.crates-io]
naga = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
naga-types = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core-deps-apple = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core-deps-emscripten = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-hal = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-naga-bridge = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
wgpu-types = { git = "https://github.com/bea4dev/wgpu", rev = "ff143aeeb126dce521b87f47547565c4b6a6da1e" }
