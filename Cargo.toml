[package]
name = "minkashell"
version = "0.1.0"
edition = "2024"
description = "Minka session shell: bar, dock, menus, notifications"

[[bin]]
name = "minkashell"
path = "src/main.rs"

[dependencies]
# "svg" is not optional here: the window-control buttons (assets/mac-glass-*.svg)
# and nearly every icon of an SVG icon theme are decoded through it, and without
# it they draw as nothing, with no message.
#
# The toolkit is MinkaDE's AntiWebUI submodule, a sibling of this one, so every Minka app
# builds the same revision and a toolkit fix reaches them all.
anti-webui = { path = "../AntiWebUI/src/anti-webui", default-features = false, features = ["svg", "wayland", "wayland-shell", "shell-apps", "shell-audio", "shell-battery", "shell-notifications", "shell-process", "shell-session", "shell-system", "shell-tray"] }
# Material 3 Expressive components, drawn in the Proustite scheme (src/theme.rs).
anti-webui-md3e = { path = "../AntiWebUI/src/anti-webui-md3e" }
calloop = { version = "0.14", default-features = false }
minka-ipc = { package = "MinkaIPC", path = "../MinkaIPC" }
serde_json = "1"
# The same zbus, with the same features, that the toolkit already builds: the
# tray rescue (src/tray_rescue.rs) makes a few calls of its own.
zbus = { version = "5", default-features = false, features = ["async-io"] }
